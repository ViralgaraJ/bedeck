# cPanel Git Version Control deploy tasks.
# Runs in-place: this repo's working copy IS bedeck.viralgaraj.com's doc root parent
# (Document Root = .../bedeck.viralgaraj.com/public), so no rsync/DEPLOYPATH needed.
#
# NOTE: task lines that begin with a variable must be quoted as a whole string,
# otherwise the YAML parser rejects "$PHP" followed by bare text.
deployment:
  tasks:
    - export PHP=/usr/local/bin/ea-php82
    # Composer's path differs per host (not at /usr/local/bin on biz70); when it
    # can't be found, skip install and keep the vendor/ already on the server.
    - 'COMPOSER=$(command -v composer || command -v /opt/cpanel/composer/bin/composer || true)'
    - 'if [ -n "$COMPOSER" ]; then "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction --no-progress; else echo "composer not found - skipping install"; fi'
    - test -f .env || cp .env.example .env
    - '"$PHP" artisan storage:link || true'
    - '"$PHP" artisan migrate --force'
    - '"$PHP" artisan optimize:clear'
    - '"$PHP" artisan config:cache'
    - rsync -a --exclude='index.php' public/ ../public_html/ || true