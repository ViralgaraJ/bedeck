name: Deploy (cPanel over SSH)

# Runs after CI on pushes to main. It stays SKIPPED until you set the repo
# variable  DEPLOY_TARGET = cpanel-ssh  and add the secrets listed in docs/CI-CD.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_TARGET == 'cpanel-ssh' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, ctype, curl, fileinfo, gd, pdo_mysql, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to cPanel
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='bootstrap/cache/*' \
            --exclude='public/uploads/products/*' \
            --exclude='public/uploads/datasheets/*' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Run migrations & rebuild caches on the server
        run: |
          PHP="${{ secrets.PHP_BIN }}"
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<EOF
          set -e
          cd "${{ secrets.DEPLOY_PATH }}"
          [ -f .env ] || { echo "::error::.env is missing on the server — create it once, then re-run."; exit 1; }
          "\$PHP" artisan down --render="errors::503" || true
          "\$PHP" artisan migrate --force
          "\$PHP" artisan storage:link || true
          "\$PHP" artisan optimize:clear
          "\$PHP" artisan config:cache
          "\$PHP" artisan route:cache
          "\$PHP" artisan view:cache
          "\$PHP" artisan up
          EOF
